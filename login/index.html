<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to StudyHub — Your student productivity platform.">
    <title>Login — StudyHub</title>

    <!-- Favicon (same as main site) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8 10h12M8 14h8M8 18h10' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='28' y2='28'%3E%3Cstop stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== BACKGROUND BLOBS (decorative) ===== -->
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- ===== MAIN LOGIN CONTAINER ===== -->
    <main class="login-page">

        <!-- Logo linking back to home -->
        <a href="../index.html" class="logo" aria-label="Back to StudyHub Home">
            <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
                <rect width="28" height="28" rx="8" fill="url(#logo-g)" />
                <path d="M8 10h12M8 14h8M8 18h10" stroke="white" stroke-width="2" stroke-linecap="round" />
                <defs>
                    <linearGradient id="logo-g" x1="0" y1="0" x2="28" y2="28">
                        <stop stop-color="#7c3aed" />
                        <stop offset="1" stop-color="#3b82f6" />
                    </linearGradient>
                </defs>
            </svg>
            <span>StudyHub</span>
        </a>

        <!-- Login Card -->
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to continue your learning journey</p>
            </div>

            <form id="login-form" novalidate>
                <!-- Email Field -->
                <div class="form-group" id="email-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                            <path d="M22 4L12 13L2 4" />
                        </svg>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com"
                            autocomplete="email" aria-describedby="email-error" aria-required="true">
                    </div>
                    <span class="error-message" id="email-error" role="alert"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group" id="password-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0110 0v4" />
                        </svg>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password"
                            autocomplete="current-password" aria-describedby="password-error" aria-required="true">
                    </div>
                    <span class="error-message" id="password-error" role="alert"></span>
                </div>

                <!-- Show Password Checkbox -->
                <div class="checkbox-row">
                    <label class="checkbox-label" for="show-password">
                        <input type="checkbox" id="show-password" class="checkbox-input">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Show Password</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-login" id="login-btn">
                    <span class="btn-text">Log In</span>
                    <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>

                <!-- Success Message (hidden by default) -->
                <div class="success-message" id="success-message" role="status" aria-live="polite">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="9 12 12 15 16 10" />
                    </svg>
                    <span>Login Successful! Redirecting…</span>
                </div>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="#" class="signup-link">Sign up free</a></p>
            </div>
        </div>

        <p class="back-link">
            <a href="../index.html">← Back to Home</a>
        </p>
    </main>

    <script src="script.js"></script>
</body>

</html>
